services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading_system}
      POSTGRES_USER: ${POSTGRES_USER:-quant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quant_user} -d ${POSTGRES_DB:-trading_system}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [trading-net]

  redis:
    image: redis:7-alpine
    container_name: trading_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [trading-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quant_user}:${POSTGRES_PASSWORD:-change-this-password}@postgres:5432/${POSTGRES_DB:-trading_system}
      REDIS_URL: redis://redis:6379/0
      MT5_BRIDGE_URL: http://mt5-bridge:5001
      CORS_ORIGINS: '["*"]'
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FINNHUB_ECONOMIC_CALENDAR_ENABLED: ${FINNHUB_ECONOMIC_CALENDAR_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks: [trading-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading_frontend
    restart: unless-stopped
    depends_on: [backend]
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
    networks: [trading-net]

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: trading_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    networks: [trading-net]
    depends_on: [frontend]

  # ============================================================
  # MT5 Wine Server — Wine + Xvfb + MT5 Terminal + RPyC Server
  # Image: lprett/mt5linux:latest  (lucas-campagna/mt5linux)
  # Exposes: port 18812 (RPyC) + 8080 (noVNC web GUI optional)
  # ============================================================
  mt5-wine-server:
    image: lprett/mt5linux:latest
    container_name: trading_mt5_wine
    restart: unless-stopped
    environment:
      MT5_HOST: "0.0.0.0"
      MT5_LOGIN: ${MT5_DEMO_LOGIN:-5057446983}
      MT5_PASSWORD: ${MT5_DEMO_PASSWORD:-FxN@6nZf}
      MT5_SERVER: ${MT5_DEMO_SERVER:-MetaQuotes-Demo}
      VNC_PASSWORD: ${MT5_VNC_PASSWORD:-trading123}
    ports:
      - "18812:18812"   # RPyC — MT5 Python RPC bridge
      - "8080:8080"     # noVNC — Web GUI monitor (optional)
    volumes:
      - mt5data:/root/.wine  # Persist Wine prefix & MT5 installation
    networks: [trading-net]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 18812 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ============================================================
  # MT5 Bridge — FastAPI HTTP Gateway (connects via mt5linux RPyC)
  # Depends on mt5-wine-server being healthy on port 18812
  # ============================================================
  mt5-bridge:
    build:
      context: ./mt5-bridge
      dockerfile: Dockerfile
    container_name: trading_mt5_bridge
    restart: unless-stopped
    environment:
      MT5_LOGIN: ${MT5_DEMO_LOGIN:-5057446983}
      MT5_PASSWORD: ${MT5_DEMO_PASSWORD:-FxN@6nZf}
      MT5_SERVER: ${MT5_DEMO_SERVER:-MetaQuotes-Demo}
      MT5_HOST: mt5-wine-server   # <-- Docker service hostname (NOT localhost)
      MT5_PORT: ${MT5_PORT:-18812}
    volumes:
      - ./mt5-bridge:/app
    ports:
      - "5001:5001"
    depends_on:
      mt5-wine-server:
        condition: service_started
    networks: [trading-net]

networks:
  trading-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  mt5data:  # Persistent Wine prefix & MT5 terminal installation